    'Metalurji ve Malzeme Müh.': '#1f77b4',

    'Malzeme Bilimi ve Teknolojileri': '#9467bd',
    'Polimer Mühendisliği': '#d62728'
};

function render() {
    const traces = [];
    Object.keys(catColors).forEach(cat => {
        ['DEVLET', 'VAKIF'].forEach(utype => {
            const subset = rawData.filter(d => d.cat === cat && d.type === utype);
            if(subset.length > 0) {
                traces.push({
                    x: subset.map(d => d.kontenjan),
                    y: subset.map(d => d.enKucuk),
                    mode: 'markers',
                    name: `${cat} (${utype})`,
                    marker: { size: 10, color: catColors[cat] }
                });
            }
        });
    });

    const layout = {
        title: 'Ashby Map (YKS 2026)',
        xaxis: { type: 'log', title: 'Kontenjan (Log)', autorange: true },
        yaxis: { type: 'log', title: 'Puan (Log)', autorange: true },
        hovermode: 'closest',
        margin: { l: 50, r: 20, t: 50, b: 50 }
    };

    Plotly.newPlot('chart', traces, layout, { responsive: true });
}
